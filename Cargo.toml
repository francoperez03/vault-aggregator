[workspace]
resolver = "2"
members = [
    "packages/contracts/vault-adapter",
    "packages/contracts/vault-core",
    "packages/contracts/adapter-e2e",
]
# adapter-e2e (host-only, pulls the full alloy client) is a workspace member but stays out of
# default-members: `cargo stylus deploy` builds every default member for wasm32-unknown-unknown,
# and the full `alloy` client does not compile for that target (M1 hit this exact wall when
# `coinflip-e2e` joined the workspace).
default-members = ["packages/contracts/vault-adapter", "packages/contracts/vault-core"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("contract-client-gen"))'] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
