<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Vaulty's mark: the strategy ring itself — one circle split in four, one arc per protocol
       (Aave / Morpho / Fluid / Euler identity colors), on the app's own canvas. Quarter arcs with
       a hairline gap so it still reads as a segmented wheel at 16px. -->
  <circle cx="12" cy="12" r="12" fill="#0A0C0F" />
  <g transform="rotate(-90 12 12)" fill="none" stroke-width="4.6" stroke-dasharray="12.15 41.25">
    <circle cx="12" cy="12" r="8.5" stroke="#B6509E" stroke-dashoffset="-0.6" />
    <circle cx="12" cy="12" r="8.5" stroke="#5B8EFA" stroke-dashoffset="-13.95" />
    <circle cx="12" cy="12" r="8.5" stroke="#00D4FF" stroke-dashoffset="-27.3" />
    <circle cx="12" cy="12" r="8.5" stroke="#2AE5B9" stroke-dashoffset="-40.65" />
  </g>
</svg>
