<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Same construction as CoinFlip's mark: one solid brand circle with the glyph knocked out in
       the canvas colour, so it reads at 16px and sits on any surface. The glyph is this app's own
       subject — three columns at different levels, the allocation split across protocols. -->
  <circle cx="12" cy="12" r="12" fill="#12aaff" />
  <g fill="#0a0c0f">
    <rect x="5.6" y="12.4" width="3.4" height="5.6" rx="1.7" />
    <rect x="10.3" y="8.6" width="3.4" height="9.4" rx="1.7" />
    <rect x="15" y="6" width="3.4" height="12" rx="1.7" />
  </g>
</svg>
