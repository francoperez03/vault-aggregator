<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source for the rasterised store / home-screen icons (apple-icon.png, icon-512.png).
       Full-bleed square: the OS masks it to its own shape, so no rounded corners are baked in.
       The canvas repeats the app's ambient — void background with a cyan glow off-centre — so the
       icon and the first screen are recognisably the same place. -->
  <defs>
    <radialGradient id="ambient" cx="30%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#12aaff" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0160e4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#12aaff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#12aaff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#0a0c0f" />
  <rect width="512" height="512" fill="url(#ambient)" />
  <circle cx="256" cy="256" r="190" fill="url(#halo)" />

  <circle cx="256" cy="256" r="146" fill="#12aaff" />
  <g fill="#0a0c0f">
    <rect x="178" y="261" width="41" height="68" rx="20.5" />
    <rect x="235" y="215" width="41" height="114" rx="20.5" />
    <rect x="292" y="183" width="41" height="146" rx="20.5" />
  </g>
</svg>
