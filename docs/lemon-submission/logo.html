<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0A0C0F; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<!-- Vaulty logo at submission resolution: the strategy wheel (one circle split in four protocol
     colors) on the app canvas, thicker arcs + glow so it carries at store sizes. -->
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="12" fill="#0A0C0F" />
  <g transform="rotate(-90 12 12)" fill="none" stroke-width="4.6" stroke-dasharray="12.15 41.25" stroke-linecap="butt">
    <circle cx="12" cy="12" r="8.5" stroke="#B6509E" stroke-dashoffset="-0.6" style="filter: drop-shadow(0 0 0.7px #B6509E)"/>
    <circle cx="12" cy="12" r="8.5" stroke="#5B8EFA" stroke-dashoffset="-13.95" style="filter: drop-shadow(0 0 0.7px #5B8EFA)"/>
    <circle cx="12" cy="12" r="8.5" stroke="#00D4FF" stroke-dashoffset="-27.3" style="filter: drop-shadow(0 0 0.7px #00D4FF)"/>
    <circle cx="12" cy="12" r="8.5" stroke="#2AE5B9" stroke-dashoffset="-40.65" style="filter: drop-shadow(0 0 0.7px #2AE5B9)"/>
  </g>
</svg>
</body>
</html>
